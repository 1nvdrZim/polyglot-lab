<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polyglot Lab</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="site/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Polyglot Lab</h1>
      <p>The same programs in five languages, and git along the way.</p>
    </div>
    <div class="progress" aria-live="polite">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-text"></span>
    </div>
    <nav id="tabs" role="tablist">
      <button role="tab" data-view="lessons">Lessons</button>
      <button role="tab" data-view="git">Git</button>
      <button role="tab" data-view="projects">Projects</button>
    </nav>
  </header>

  <main id="view"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="site/curriculum.js"></script>
  <script src="site/app.js"></script>
</body>
</html>
